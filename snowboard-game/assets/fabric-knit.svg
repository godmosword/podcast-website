<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Soft knit albedo multiply: warm white weave -->
  <defs>
    <pattern id="knit" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f7f2ea"/>
      <path d="M0 8 H16 M8 0 V16" stroke="#e8dcc8" stroke-width="1.4" opacity="0.7"/>
      <circle cx="8" cy="8" r="1.1" fill="#d9c7ad" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#knit)"/>
</svg>
