name: Sync Apple Podcast

on:
  # 可靠來源：外部排程（cron-job.org 等）打 repository_dispatch API 觸發，
  # 繞過 GitHub 內建 schedule 的不可靠（best-effort、常延遲數小時甚至跳過）。
  # 設定步驟見 README「外部排程觸發」。
  repository_dispatch:
    types: [sync-now]
  # 後備：GitHub 內建 schedule（best-effort，幾小時內會補到；準時性靠上面的外部觸發）。
  schedule:
    - cron: "*/15 * * * *"
  # 手動：Actions 頁 Run workflow，上架後想立即上站時用。
  workflow_dispatch:

# 同一時間只跑一支，避免兩個排程交疊各自 push 衝突。
concurrency:
  group: sync-apple-podcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 首次需下載 ~3GB 模型 + 編譯 whisper + 轉錄，預留較長時間。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache whisper.cpp build + model
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper-cpp
            models/ggml-large-v3.bin
          key: whisper-large-v3-${{ runner.os }}-v1.8.6
          restore-keys: |
            whisper-large-v3-${{ runner.os }}-

      - name: Setup whisper for subtitle transcription
        run: bash scripts/setup-whisper-ci.sh

      - name: Sync episodes from Apple Podcast
        run: npm run sync:apple
      # sync 內建：轉錄新集 → 字幕再處理（簡轉繁 + 過濾）→ 才進 test/build/deploy

      # RSS 與 repo 完全一致時 sync 不動任何檔案，可早退、不浪費 CI 跑 test+build。
      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping test/build/push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will validate and push."
          fi

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Production build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple-synced.json data/apple-sync-state.json public/stories/ data/subtitles/
          if git diff --staged --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "chore: sync Apple Podcast from RSS"
          git push
