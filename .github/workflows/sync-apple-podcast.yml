name: Sync Apple Podcast

on:
  # 可靠來源：外部排程（cron-job.org 等）打 repository_dispatch API 觸發，
  # 繞過 GitHub 內建 schedule 的不可靠（best-effort、常延遲數小時甚至跳過）。
  # 設定步驟見 README「外部排程觸發」。
  repository_dispatch:
    types: [sync-now]
  # 後備：GitHub 內建 schedule（best-effort，幾小時內會補到；準時性靠上面的外部觸發）。
  schedule:
    - cron: "*/15 * * * *"
  # 手動：Actions 頁 Run workflow，上架後想立即上站時用。
  workflow_dispatch:

# 同一時間只跑一支，避免兩個排程交疊各自 push 衝突。
concurrency:
  group: sync-apple-podcast
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 首次需下載 ~3GB 模型 + 編譯 whisper + 轉錄，預留較長時間。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # job-level env 不可用 runner context；改用 runner 內建 $RUNNER_TEMP 寫入 GITHUB_ENV
      - name: Set sync report paths
        run: |
          echo "SYNC_REPORT_PATH=$RUNNER_TEMP/sync-run-report.json" >> "$GITHUB_ENV"
          echo "SYNC_COMMIT_MSG_PATH=$RUNNER_TEMP/sync-commit-msg.txt" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache whisper.cpp build + model
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper-cpp
            models/ggml-large-v3.bin
          key: whisper-large-v3-${{ runner.os }}-v1.8.6
          restore-keys: |
            whisper-large-v3-${{ runner.os }}-

      - name: Setup whisper for subtitle transcription
        run: bash scripts/setup-whisper-ci.sh

      - name: Sync episodes from Apple Podcast
        run: npm run sync:apple
      # sync 內建：轉錄新集 → 字幕再處理（簡轉繁 + 過濾）→ 寫 sync-run-report.json

      # 每次 sync 後一律驗證 workflow 框架條件（pageCount／captionTimes／captions／插圖數），
      # error 會擋下 push；warn（待生圖、legacy）寫進 Job Summary 讓待辦持續可見。
      - name: Verify episode workflow (ep-9/ep-10 standard)
        run: |
          set -o pipefail
          npm run verify:episodes 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify browse index (vehicles / topics)
        run: |
          set -o pipefail
          npm run verify:browse-index 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # RSS 與 repo 完全一致時 sync 不動任何檔案，可早退、不浪費 CI 跑 test+build。
      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping test/build/push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will validate and push."
          fi

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Production build
        if: steps.changes.outputs.changed == 'true'
        env:
          # CI 上無 Vercel 環境變數，未設定時 siteUrl 會 fallback 成 localhost，
          # 觸發 generate-llms-full 的防呆而使 build 失敗（見 lib/site-url.ts）。
          NEXT_PUBLIC_SITE_URL: https://podcast-website-mu.vercel.app
        run: npm run build

      - name: Prepare commit message
        if: steps.changes.outputs.changed == 'true'
        run: npx tsx scripts/post-sync-notify.ts

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple-synced.json data/apple-sync-state.json data/browse-index.json public/stories/ data/subtitles/
          if git diff --staged --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -F "$SYNC_COMMIT_MSG_PATH"
          # main 在本 run 期間可能被人為 push 推進（sync 跑 2 分鐘以上就有機率撞上），
          # 直接 push 會被 non-fast-forward 拒絕 → 誤發「同步失敗」告警（見 issue #36）。
          # sync 只動 data/ 與 public/stories/，與人為 commit 幾乎不重疊，rebase 重試即可。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被拒（remote 有新 commit），rebase 後重試（$attempt/3）"
            git pull --rebase origin main
          done
          git push

      # ---- 通知（push 後才送，避免 push 失敗誤報「已上站」）----
      - name: Notify live (open illustrate issues for new episodes)
        if: success() && steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # 手機推播：維護者安裝 GitHub App，以下 assign／@mention 會觸發通知
          SYNC_ISSUE_ASSIGNEES: ${{ secrets.SYNC_ISSUE_ASSIGNEES }}
          SYNC_ISSUE_MENTIONS: ${{ secrets.SYNC_ISSUE_MENTIONS }}
          NOTIFY_SITE_URL: ${{ secrets.NOTIFY_SITE_URL }}
        run: npx tsx scripts/sync-alert.ts notify-live

      - name: Resolve sync-failure issue on success
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/sync-alert.ts resolve --kind=sync-job-failure

      # ---- 失敗告警（不依賴 npm/tsx，涵蓋 deps 安裝前的早期失敗）----
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SYNC_ISSUE_ASSIGNEES: ${{ secrets.SYNC_ISSUE_ASSIGNEES }}
          SYNC_ISSUE_MENTIONS: ${{ secrets.SYNC_ISSUE_MENTIONS }}
        with:
          script: |
            const base = "sync-alert";
            const kind = "sync-job-failure";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const mentions = (process.env.SYNC_ISSUE_MENTIONS || "").trim();
            const body = [
              mentions,
              mentions ? "" : null,
              "⚠️ Apple 同步 workflow 失敗，新集可能未上站。",
              "",
              `- Run：${runUrl}`,
              `- Workflow：${process.env.GITHUB_WORKFLOW}`,
              `- 觸發：${process.env.GITHUB_EVENT_NAME}`,
              `- Commit：${process.env.GITHUB_SHA}`,
              `- 時間：${new Date().toISOString()}`,
            ].filter((l) => l !== null).join("\n");
            // 確保 label 存在（best-effort）
            for (const [name, color, desc] of [[base, "5319e7", "同步告警"], [kind, "d73a4a", "Apple 同步 workflow 失敗"]]) {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description: desc }); } catch {}
            }
            // 同類去重：開啟中已有 → comment；否則開新單
            const found = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: `${base},${kind}`, per_page: 1 });
            if (found.data.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.data[0].number, body });
              core.info(`已補 comment 至 #${found.data[0].number}`);
            } else {
              const assignees = (process.env.SYNC_ISSUE_ASSIGNEES || "").split(",").map((s) => s.trim()).filter(Boolean);
              const issue = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "⚠️ Apple 同步失敗", body, labels: [base, kind], assignees });
              core.info(`已開 Issue #${issue.data.number}`);
            }
