name: Sync Apple Podcast

on:
  schedule:
    # 每天 UTC 01:00（約台灣 09:00）
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync new episodes from Apple Podcast
        run: npm run sync:apple

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple-synced.json data/apple-sync-state.json public/stories/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync new episodes from Apple Podcast"
          git push
