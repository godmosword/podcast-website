name: Sync Apple Podcast

on:
  # 可靠來源：外部排程（cron-job.org 等）打 repository_dispatch API 觸發，
  # 繞過 GitHub 內建 schedule 的不可靠（best-effort、常延遲數小時甚至跳過）。
  # 設定步驟見 README「外部排程觸發」。
  repository_dispatch:
    types: [sync-now]
  # 後備：GitHub 內建排程（best-effort，幾小時內會補到；準時性靠上面的外部觸發）。
  schedule:
    - cron: "*/15 * * * *"
  # 手動：Actions 頁 Run workflow，上架後想立即上站時用。
  workflow_dispatch:

# 同一時間只跑一支，避免兩個排程交疊各自 push 衝突。
concurrency:
  group: sync-apple-podcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync new episodes from Apple Podcast
        run: npm run sync:apple

      # 沒有新集時 sync 不動任何檔案（state 也不寫），可早退、不浪費 CI 跑 test+build。
      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping test/build/push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will validate and push."
          fi

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Production build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple-synced.json data/apple-sync-state.json public/stories/
          if git diff --staged --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "chore: sync new episodes from Apple Podcast"
          git push
