name: Sync Vocus articles

on:
  schedule:
    # 每 6 小時，對齊台北（UTC+8、無日光節約）：02:20、08:20、14:20、20:20。
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: sync-vocus-articles
  cancel-in-progress: false

# GITHUB_TOKEN 需要能推分支、開 PR、在 GH013 時以 workflow_dispatch 補跑 CI，
# 並把 quality／build-and-public-e2e 鏡射成 ruleset 認的 commit status。
# 另須在 repo 開啟 Allow auto-merge，以及 Allow GitHub Actions to create and approve pull requests。
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync Vocus parent articles
        run: npx tsx scripts/sync-vocus-articles.ts --report "$RUNNER_TEMP/vocus-sync-report.json"

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new Vocus articles."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fonttools
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: python3 -m pip install --break-system-packages fonttools brotli

      - name: Download font sources
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -fsSL -A "podcast-website-font-subset/1.0" -o /tmp/huninn.ttf "https://github.com/justfont/open-huninn-font/releases/download/v2.1/jf-openhuninn-2.1.ttf"
          curl -fsSL -A "podcast-website-font-subset/1.0" -o /tmp/GenSenRounded2TW-B.otf "https://raw.githubusercontent.com/ButTaiwan/gensen-font/master/otf/TW/GenSenRounded2TW-B.otf"

      - name: Subset fonts
        id: fonts
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm run font:subset

      - name: Lint
        id: lint
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        id: test
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm test

      - name: Commit and merge when checks pass
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FONTS: ${{ steps.fonts.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: bash scripts/finish-vocus-sync.sh
