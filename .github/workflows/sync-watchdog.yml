name: Sync Watchdog

# 獨立看門狗：驗證 RSS 最新一集是否已上站。
on:
  repository_dispatch:
    types: [watchdog-now]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

env:
  HUSKY: "0"
  SYNC_ALERT_STREAK_PATH: .cache/sync-watchdog-streak.json

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: bash scripts/ci/npm-install.sh
      - name: Restore alert streak
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sync-watchdog-streak.json
          key: sync-watchdog-streak-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sync-watchdog-streak-
      - name: Ensure alert streak file
        run: bash scripts/ci/ensure-streak-file.sh
      - name: Check RSS freshness vs site
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_HOURS: "3"
          SYNC_ISSUE_ASSIGNEES: ${{ secrets.SYNC_ISSUE_ASSIGNEES }}
          SYNC_ISSUE_MENTIONS: ${{ secrets.SYNC_ISSUE_MENTIONS }}
        run: npx tsx scripts/check-sync-fresh.ts
      - name: Save alert streak
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sync-watchdog-streak.json
          key: sync-watchdog-streak-${{ github.run_id }}-${{ github.run_attempt }}
