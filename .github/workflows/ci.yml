name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      required_only:
        description: "只跑 protect-main-web 所需的 quality、build-and-public-e2e、sync-validate"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://podcast-website-mu.vercel.app
  HUSKY: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sync path scope
        id: scope
        run: bash scripts/ci/sync-path-guard.sh
      - name: actionlint
        if: steps.scope.outputs.sync_only != 'true'
        run: bash scripts/ci/run-actionlint.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.sync_only != 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm ci
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm run audit:production
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm run lint
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm run verify:service-worker
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm test

  build-and-public-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sync path scope
        id: scope
        run: bash scripts/ci/sync-path-guard.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.scope.outputs.sync_only != 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm ci
      - if: steps.scope.outputs.sync_only != 'true'
        run: npm run build
      - name: Install Chromium for public release gate
        if: steps.scope.outputs.sync_only != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run public smoke and accessibility gate
        if: steps.scope.outputs.sync_only != 'true'
        env:
          PW_REUSE_SERVER: "1"
        run: npm run test:e2e:public

  # 兒童主路徑／地圖觸控 e2e。不是 GitHub ruleset 的 required check 名稱
  #（仍為 build-and-public-e2e）；視覺回歸刻意不進 CI。不動 Apple sync workflow。
  e2e-child-path:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.required_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for child-path e2e
        run: npx playwright install --with-deps chromium
      - name: Run child-path Playwright e2e
        env:
          PW_REUSE_SERVER: "1"
        run: npm run test:e2e:ci

  # ruleset 候選 required check。名字必須是 sync-validate。
  # required_only 也要跑，不能套 e2e-child-path 那個 if。
  sync-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sync path guard
        run: bash scripts/ci/sync-path-guard.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Validate sync outputs
        run: npm run sync:validate
