# GEO live 煙霧測試的手動入口（可指定任一網址，例如官網暫時網址）。
# 正式網域的自動檢查在 live-domain.yml：等網域換上該次 push 的 build 才跑。
name: verify-geo-live

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "部署站點根 URL（含 https://，不含尾斜線）"
        required: true
        default: "https://carcarplayground.com"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - name: verify:geo-live
        env:
          BASE_URL: ${{ inputs.base_url || 'https://carcarplayground.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.base_url || 'https://carcarplayground.com' }}
        run: |
          case "$BASE_URL" in
            https://carcarplayground.com)
              npm run verify:geo-live -- --base-url="$BASE_URL" --production
              ;;
            *)
              npm run verify:geo-live -- --base-url="$BASE_URL"
              ;;
          esac
