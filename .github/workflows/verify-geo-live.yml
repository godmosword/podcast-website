# 部署後 GEO live 煙霧測試；production deployment 成功後自動觸發，也保留手動入口。
name: verify-geo-live

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "部署站點根 URL（含 https://，不含尾斜線）"
        required: true
        default: "https://podcast-website-mu.vercel.app"

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: verify:geo-live
        env:
          BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://podcast-website-mu.vercel.app' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_URL || 'https://podcast-website-mu.vercel.app' }}
        run: npm run verify:geo-live -- --base-url="$BASE_URL" --production
